name: Deploy To SeeCure

on:
  push:
    branches: ['main'] # Triggers only when code is pushed or merged into main

jobs:
  sync-files:
    runs-on: self-hosted # Runs on your local Windows 11 machine

    steps:
      # Pull the fresh changes from the merged main branch into the temporary workspace
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sync only the modified files to your live folder
      - name: Pull Latest Code From GitHub
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"

          # Clear the ownership block error
          git config --global --add safe.directory C:/SeeCure

          # Set remote url
          git remote set-url origin "https://github.com/ralphdelara/SeeCure-MedicalCorporation.git"

          # Synchronize cleanly
          git fetch origin main
          git reset --hard origin/main
          git pull origin main

      - name: Composer install
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          composer config -g disable-tls true
          composer install --no-interaction --prefer-dist

      - name: NPM install (ci)
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          npm ci

      - name: Perform Database Migrate
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          php artisan migrate --force

      - name: Run Operation Process
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          php artisan operations:process

      - name: Compile Front End Files
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          npm run build
