name: Deploy To SeeCure

on:
  push:
    branches: ['main'] # Triggers only when code is pushed or merged into main

jobs:
  sync-files:
    runs-on: self-hosted # Runs on your local Windows 11 machine

    steps:
      # Pull the fresh changes from the merged main branch into the temporary workspace
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sync only the modified files to your live folder
      - name: Move Updated Files Only
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          $targetFolder = "C:\SeeCure"
          Write-Output "Syncing updated files to $targetFolder..."

          # Robocopy automatically checks file sizes/timestamps and transfers ONLY updated files.
          # It skips unmodified files, making the transfer extremely fast.
          robocopy . $targetFolder /Mirror /XD .git node_modules storage .github /R:2 /W:5

          # Robocopy exit codes 0 to 3 indicate a successful transfer/no changes needed.
          if ($LastExitCode -gt 3) { throw "File sync failed with exit code $LastExitCode" }

      - name: Composer install
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: NPM install (ci)
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          npm ci

      - name: Perform Database Migrate
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          php artisan migrate --force

      - name: Run Operation Process
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          php artisan operations:process

      - name: Compile Front End Files
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          npm run build
