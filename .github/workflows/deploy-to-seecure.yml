name: Deploy To SeeCure

on:
  push:
    branches: ['main'] # Triggers only when code is pushed or merged into main

jobs:
  sync-files:
    runs-on: self-hosted # Runs on your local Windows 11 machine

    steps:
      # Pull the fresh changes from the merged main branch into the temporary workspace
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sync only the modified files to your live folder
      - name: Move Updated Files Only
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          $targetFolder = "C:\SeeCureTEST"
          Write-Output "Syncing updated files to $targetFolder..."

          # Run robocopy and capture its exit code immediately
          robocopy . $targetFolder /MIR /XD .git node_modules storage .github /R:2 /W:5
          $robocopyExitCode = $LastExitCode

          Write-Output "Robocopy finished with exit code: $robocopyExitCode"

          # In Robocopy, any code from 0 to 3 means a successful execution.
          # Throw an error only if the code is 4 or higher (fatal errors like 8 or 16).
          if ($robocopyExitCode -gt 3) {
              throw "Robocopy encountered a fatal error. Code: $robocopyExitCode"
          } else {
              Write-Output "File synchronization finished successfully!"
              exit 0 # Forces PowerShell to return 0 so GitHub Actions knows it succeeded
          }

      - name: Composer install
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: NPM install (ci)
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          npm ci

      - name: Perform Database Migrate
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          php artisan migrate --force

      - name: Run Operation Process
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          php artisan operations:process

      - name: Compile Front End Files
        shell: powershell -ExecutionPolicy Bypass {0}
        run: |
          cd "C:\SeeCure"
          npm run build
