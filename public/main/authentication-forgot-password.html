<!doctype html>
<html
    lang="en"
    dir="ltr"
    data-bs-theme="light"
    data-color-theme="Blue_Theme"
    data-layout="vertical"
>
    <head>
        <!-- Required meta tags -->
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Favicon icon-->
        <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />

        <!-- Core Css -->
        <link rel="stylesheet" href="../assets/css/styles.css" />

        <title>Modernize Bootstrap Admin</title>
    </head>

    <body>
        <!-- Preloader -->
        <div class="preloader">
            <img
                src="../assets/images/logos/favicon.png"
                alt="loader"
                class="lds-ripple img-fluid"
            />
        </div>
        <div id="main-wrapper" class="auth-customizer-none">
            <div class="position-relative radial-gradient min-vh-100 w-100 overflow-hidden">
                <div class="position-relative z-index-5">
                    <div class="row">
                        <div class="col-lg-6 col-xl-8">
                            <a
                                href="../main/index.html"
                                class="logo-img d-block w-100 px-4 py-9 text-nowrap"
                            >
                                <img
                                    src="../assets/images/logos/dark-logo.svg"
                                    class="dark-logo"
                                    alt="Logo-Dark"
                                />
                                <img
                                    src="../assets/images/logos/light-logo.svg"
                                    class="light-logo"
                                    alt="Logo-light"
                                />
                            </a>
                            <div
                                class="d-none d-lg-flex align-items-center justify-content-center h-n80"
                            >
                                <img
                                    src="../assets/images/backgrounds/login-security.svg"
                                    alt="modernize-img"
                                    class="img-fluid"
                                    width="500"
                                />
                            </div>
                        </div>
                        <div class="col-lg-6 col-xl-4">
                            <div class="card rounded-0 min-vh-100 mb-0 h-100 shadow-none">
                                <div
                                    class="auth-max-width d-flex align-items-center mx-auto h-100 w-100"
                                >
                                    <div class="card-body">
                                        <div class="mb-5">
                                            <h2 class="fw-bolder fs-7 mb-3">
                                                Forgot your password?
                                            </h2>
                                            <p class="mb-0">
                                                Please enter the email address associated with your
                                                account and We will email you a link to reset your
                                                password.
                                            </p>
                                        </div>
                                        <form>
                                            <div class="mb-3">
                                                <label for="exampleInputEmail1" class="form-label"
                                                    >Email address</label
                                                >
                                                <input
                                                    type="email"
                                                    class="form-control"
                                                    id="exampleInputEmail1"
                                                    aria-describedby="emailHelp"
                                                />
                                            </div>
                                            <a
                                                href="javascript:void(0)"
                                                class="btn btn-primary mb-3 w-100 py-8"
                                                >Forgot Password</a
                                            >
                                            <a
                                                href="../main/authentication-login.html"
                                                class="btn bg-primary-subtle w-100 py-8 text-primary"
                                                >Back to Login</a
                                            >
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <script>
                function handleColorTheme(e) {
                    document.documentElement.setAttribute('data-color-theme', e);
                }
            </script>
            <button
                class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center customizer-btn p-3"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasExample"
                aria-controls="offcanvasExample"
            >
                <i class="icon ti ti-settings fs-7"></i>
            </button>

            <div
                class="offcanvas customizer offcanvas-end"
                tabindex="-1"
                id="offcanvasExample"
                aria-labelledby="offcanvasExampleLabel"
            >
                <div class="d-flex align-items-center justify-content-between border-bottom p-3">
                    <h4 class="offcanvas-title fw-semibold" id="offcanvasExampleLabel">Settings</h4>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="offcanvas"
                        aria-label="Close"
                    ></button>
                </div>
                <div class="offcanvas-body h-n80" data-simplebar>
                    <h6 class="fw-semibold fs-4 mb-2">Theme</h6>

                    <div class="d-flex customizer-box flex-row gap-3" role="group">
                        <input
                            type="radio"
                            class="btn-check light-layout"
                            name="theme-layout"
                            id="light-layout"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary rounded-2 p-9" for="light-layout">
                            <i class="icon ti ti-brightness-up fs-7 me-2"></i>Light
                        </label>

                        <input
                            type="radio"
                            class="btn-check dark-layout"
                            name="theme-layout"
                            id="dark-layout"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary rounded-2 p-9" for="dark-layout">
                            <i class="icon ti ti-moon fs-7 me-2"></i>Dark
                        </label>
                    </div>

                    <h6 class="fw-semibold fs-4 mt-5 mb-2">Theme Direction</h6>
                    <div class="d-flex customizer-box flex-row gap-3" role="group">
                        <input
                            type="radio"
                            class="btn-check"
                            name="direction-l"
                            id="ltr-layout"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary p-9" for="ltr-layout">
                            <i class="icon ti ti-text-direction-ltr fs-7 me-2"></i>LTR
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="direction-l"
                            id="rtl-layout"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary p-9" for="rtl-layout">
                            <i class="icon ti ti-text-direction-rtl fs-7 me-2"></i>RTL
                        </label>
                    </div>

                    <h6 class="fw-semibold fs-4 mt-5 mb-2">Theme Colors</h6>

                    <div
                        class="d-flex customizer-box color-pallete flex-row flex-wrap gap-3"
                        role="group"
                    >
                        <input
                            type="radio"
                            class="btn-check"
                            name="color-theme-layout"
                            id="Blue_Theme"
                            autocomplete="off"
                        />
                        <label
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center p-9"
                            onclick="handleColorTheme('Blue_Theme')"
                            for="Blue_Theme"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="BLUE_THEME"
                        >
                            <div
                                class="color-box rounded-circle d-flex align-items-center justify-content-center skin-1"
                            >
                                <i class="ti ti-check d-flex icon fs-5 text-white"></i>
                            </div>
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="color-theme-layout"
                            id="Aqua_Theme"
                            autocomplete="off"
                        />
                        <label
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center p-9"
                            onclick="handleColorTheme('Aqua_Theme')"
                            for="Aqua_Theme"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="AQUA_THEME"
                        >
                            <div
                                class="color-box rounded-circle d-flex align-items-center justify-content-center skin-2"
                            >
                                <i class="ti ti-check d-flex icon fs-5 text-white"></i>
                            </div>
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="color-theme-layout"
                            id="Purple_Theme"
                            autocomplete="off"
                        />
                        <label
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center p-9"
                            onclick="handleColorTheme('Purple_Theme')"
                            for="Purple_Theme"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="PURPLE_THEME"
                        >
                            <div
                                class="color-box rounded-circle d-flex align-items-center justify-content-center skin-3"
                            >
                                <i class="ti ti-check d-flex icon fs-5 text-white"></i>
                            </div>
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="color-theme-layout"
                            id="green-theme-layout"
                            autocomplete="off"
                        />
                        <label
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center p-9"
                            onclick="handleColorTheme('Green_Theme')"
                            for="green-theme-layout"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="GREEN_THEME"
                        >
                            <div
                                class="color-box rounded-circle d-flex align-items-center justify-content-center skin-4"
                            >
                                <i class="ti ti-check d-flex icon fs-5 text-white"></i>
                            </div>
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="color-theme-layout"
                            id="cyan-theme-layout"
                            autocomplete="off"
                        />
                        <label
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center p-9"
                            onclick="handleColorTheme('Cyan_Theme')"
                            for="cyan-theme-layout"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="CYAN_THEME"
                        >
                            <div
                                class="color-box rounded-circle d-flex align-items-center justify-content-center skin-5"
                            >
                                <i class="ti ti-check d-flex icon fs-5 text-white"></i>
                            </div>
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="color-theme-layout"
                            id="orange-theme-layout"
                            autocomplete="off"
                        />
                        <label
                            class="btn btn-outline-primary d-flex align-items-center justify-content-center p-9"
                            onclick="handleColorTheme('Orange_Theme')"
                            for="orange-theme-layout"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="ORANGE_THEME"
                        >
                            <div
                                class="color-box rounded-circle d-flex align-items-center justify-content-center skin-6"
                            >
                                <i class="ti ti-check d-flex icon fs-5 text-white"></i>
                            </div>
                        </label>
                    </div>

                    <h6 class="fw-semibold fs-4 mt-5 mb-2">Layout Type</h6>
                    <div class="d-flex customizer-box flex-row gap-3" role="group">
                        <div>
                            <input
                                type="radio"
                                class="btn-check"
                                name="page-layout"
                                id="vertical-layout"
                                autocomplete="off"
                            />
                            <label class="btn btn-outline-primary p-9" for="vertical-layout">
                                <i class="icon ti ti-layout-sidebar-right fs-7 me-2"></i>Vertical
                            </label>
                        </div>
                        <div>
                            <input
                                type="radio"
                                class="btn-check"
                                name="page-layout"
                                id="horizontal-layout"
                                autocomplete="off"
                            />
                            <label class="btn btn-outline-primary p-9" for="horizontal-layout">
                                <i class="icon ti ti-layout-navbar fs-7 me-2"></i>Horizontal
                            </label>
                        </div>
                    </div>

                    <h6 class="fw-semibold fs-4 mt-5 mb-2">Container Option</h6>

                    <div class="d-flex customizer-box flex-row gap-3" role="group">
                        <input
                            type="radio"
                            class="btn-check"
                            name="layout"
                            id="boxed-layout"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary p-9" for="boxed-layout">
                            <i class="icon ti ti-layout-distribute-vertical fs-7 me-2"></i>Boxed
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="layout"
                            id="full-layout"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary p-9" for="full-layout">
                            <i class="icon ti ti-layout-distribute-horizontal fs-7 me-2"></i>Full
                        </label>
                    </div>

                    <h6 class="fw-semibold fs-4 mt-5 mb-2">Sidebar Type</h6>
                    <div class="d-flex customizer-box flex-row gap-3" role="group">
                        <a href="javascript:void(0)" class="fullsidebar">
                            <input
                                type="radio"
                                class="btn-check"
                                name="sidebar-type"
                                id="full-sidebar"
                                autocomplete="off"
                            />
                            <label class="btn btn-outline-primary p-9" for="full-sidebar">
                                <i class="icon ti ti-layout-sidebar-right fs-7 me-2"></i>Full
                            </label>
                        </a>
                        <div>
                            <input
                                type="radio"
                                class="btn-check"
                                name="sidebar-type"
                                id="mini-sidebar"
                                autocomplete="off"
                            />
                            <label class="btn btn-outline-primary p-9" for="mini-sidebar">
                                <i class="icon ti ti-layout-sidebar fs-7 me-2"></i>Collapse
                            </label>
                        </div>
                    </div>

                    <h6 class="fw-semibold fs-4 mt-5 mb-2">Card With</h6>

                    <div class="d-flex customizer-box flex-row gap-3" role="group">
                        <input
                            type="radio"
                            class="btn-check"
                            name="card-layout"
                            id="card-with-border"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary p-9" for="card-with-border">
                            <i class="icon ti ti-border-outer fs-7 me-2"></i>Border
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="card-layout"
                            id="card-without-border"
                            autocomplete="off"
                        />
                        <label class="btn btn-outline-primary p-9" for="card-without-border">
                            <i class="icon ti ti-border-none fs-7 me-2"></i>Shadow
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="dark-transparent sidebartoggler"></div>
        <!-- Import Js Files -->
        <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../assets/libs/simplebar/dist/simplebar.min.js"></script>
        <script src="../assets/js/theme/app.init.js"></script>
        <script src="../assets/js/theme/theme.js"></script>
        <script src="../assets/js/theme/app.min.js"></script>

        <!-- solar icons -->
        <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
        <script
            type="module"
            src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496"
            integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ=="
            data-cf-beacon='{"version":"2024.11.0","token":"3be9301eaa1743d584a13be558225a58","r":1}'
            crossorigin="anonymous"
        ></script>
    </body>
</html>
